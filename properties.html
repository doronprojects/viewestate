<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הנכסים שלנו | ViewEstate</title>
  <meta name="description" content="הנכסים בשיווק ViewEstate — פנטהאוזים, וילות ודירות יוקרה. צפו בגלריית הנכסים המלאה.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1C1008; --gold: #9A7230; --gold-light: #C9A35A; --gold-pale: #E8D5A8;
      --text-light: #F4ECD9; --text-dim: rgba(244,236,217,.66);
      --card: rgba(255,255,255,.045); --line: rgba(201,163,90,.22);
      --serif: 'Frank Ruhl Libre','David',Georgia,serif; --sans: 'Heebo',Arial,sans-serif;
      --ease: cubic-bezier(0.25,0.46,0.45,0.94);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); color: var(--text-light);
      background: linear-gradient(160deg,#402C19 0%,#4E351E 50%,#2F2015 100%) fixed;
      min-height: 100vh; line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* nav */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 48px; }
    .nav__logo { display: flex; align-items: center; gap: 12px; }
    .nav__logo svg { height: 42px; width: auto; }
    .nav__logo .word { font-family: 'Playfair Display',serif; font-weight: 700; font-size: 24px; letter-spacing: .5px; color: #fff; }
    .nav__logo .word b { color: var(--gold-light); }
    .nav__right { display: flex; align-items: center; gap: 22px; }
    .nav__right a { color: rgba(248,244,238,.9); font-size: 15px; }
    .nav__right a:hover { color: var(--gold-light); }
    .nav__cta { border: 1.5px solid var(--gold-light); color: var(--gold-light) !important; border-radius: 10px; padding: 9px 18px; transition: background .3s var(--ease); }
    .nav__cta:hover { background: var(--gold-light); color: var(--bg-dark) !important; }

    /* header */
    .head { text-align: center; max-width: 720px; margin: 26px auto 12px; padding: 0 20px; }
    .head .eyebrow { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold-light); font-weight: 600; }
    .head h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(30px,5vw,52px); margin: 12px 0 0; color: #FAF6F0; }
    .head h1 b { color: var(--gold-light); } .head h1 .e { color: rgba(250,246,240,.85); }
    .head .bar { width: 54px; height: 2px; background: var(--gold-light); margin: 18px auto 0; }

    /* grid */
    .grid { max-width: 1240px; margin: 0 auto; padding: 40px 28px 80px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 26px; }

    .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform .4s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease); }
    .pcard:hover { transform: translateY(-6px); border-color: var(--gold-light); box-shadow: 0 22px 50px rgba(0,0,0,.45); }
    .pcard__media { position: relative; aspect-ratio: 4/3; overflow: hidden; background: #2a1c12; }
    .pcard__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
    .pcard:hover .pcard__media img { transform: scale(1.06); }
    .pcard.is-sold .pcard__media img { filter: grayscale(.5) brightness(.78); }

    .pstatus { position: absolute; top: 13px; inset-inline-start: 13px; display: inline-flex; align-items: center; gap: 7px;
      background: rgba(20,12,7,.78); backdrop-filter: blur(4px); border: 1px solid var(--line);
      padding: 7px 12px; border-radius: 30px; font-size: 12.5px; font-weight: 700; color: #fff; }
    .pstatus i { width: 9px; height: 9px; border-radius: 50%; display: block; }
    .pstatus.st-sale i { background: #25B25A; box-shadow: 0 0 9px rgba(37,178,90,.9); }
    .pstatus.st-neg  i { background: #E89321; box-shadow: 0 0 9px rgba(232,147,33,.9); }
    .pstatus.st-sold i { background: #D33F2E; box-shadow: 0 0 9px rgba(211,63,46,.9); }

    .pcard__body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
    .pcard__name { font-family: var(--serif); font-size: 21px; font-weight: 700; color: #FAF6F0; margin: 0 0 4px; }
    .pcard__loc { font-size: 13.5px; color: var(--text-dim); margin: 0 0 14px; }
    .pcard__specs { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .pcard__spec { text-align: center; }
    .pcard__spec b { display: block; font-family: var(--serif); font-size: 18px; color: var(--gold-light); line-height: 1.1; }
    .pcard__spec span { font-size: 11px; color: var(--text-dim); }
    .pcard__foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 10px; }
    .pcard__price { font-family: var(--serif); font-size: 21px; font-weight: 700; color: #FAF6F0; }
    .pcard__price small { font-size: 13px; color: var(--text-dim); font-weight: 400; }
    .pcard__go { font-size: 13px; font-weight: 700; color: var(--gold-light); display: inline-flex; align-items: center; gap: 5px; }
    .pcard:hover .pcard__go { gap: 9px; }

    .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; grid-column: 1/-1; }
    footer { text-align: center; padding: 30px 20px 46px; color: var(--text-dim); font-size: 13px; }
    footer a { color: var(--gold-light); }

    @media (max-width: 880px) {
      .nav { padding: 16px 20px; }
      .nav__right a:not(.nav__cta) { display: none; }
      .grid { padding: 26px 18px 60px; gap: 18px; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav__logo">
      <svg viewBox="0 0 256 224" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0" stop-color="#ECD08A"/><stop offset=".5" stop-color="#C9A35A"/><stop offset="1" stop-color="#B58F44"/></linearGradient>
          <linearGradient id="s" x1="0" y1="0" x2="0.1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EDEDED"/><stop offset="1" stop-color="#B9B9B9"/></linearGradient>
        </defs>
        <text x="150" y="190" text-anchor="middle" font-family="'Playfair Display',Didot,Georgia,serif" font-weight="700" font-size="180" fill="url(#s)">E</text>
        <text x="96" y="157" text-anchor="middle" font-family="'Playfair Display',Didot,Georgia,serif" font-weight="700" font-size="215" fill="url(#g)">V</text>
      </svg>
      <span class="word"><b>VIEW</b>ESTATE</span>
    </a>
    <div class="nav__right">
      <a href="index.html">דף הבית</a>
      <a href="about.html">אודות</a>
      <a href="index.html#contact" class="nav__cta">דבר עם דורון</a>
    </div>
  </nav>

  <header class="head">
    <p class="eyebrow">נכסים נבחרים</p>
    <h1>הנכסים בשיווק <b>VIEW</b><span class="e">ESTATE</span></h1>
    <div class="bar"></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer><a href="index.html">‹ חזרה לאתר</a> · ViewEstate</footer>

  <script src="data.js?v=4"></script>
  <script>
    var DATA = window.VIEWESTATE_DATA || { properties: [] };
    function statusInfo(s){
      switch(s){
        case 'negotiation': return { label:'במשא ומתן', cls:'st-neg' };
        case 'sold':        return { label:'נמכר',      cls:'st-sold' };
        case 'rent':        return { label:'להשכרה',    cls:'st-sale' };
        default:            return { label:'למכירה',    cls:'st-sale' };
      }
    }
    function money(v){ return (v==null||v==='') ? '' : Number(v).toLocaleString('he-IL'); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    function card(p){
      var ss = statusInfo(p.saleStatus);
      var img = (p.gallery && p.gallery[0]) || p.poster || '';
      var loc = [p.type, p.neighborhood, p.city].filter(Boolean).join(' · ');
      var specs = '';
      if(p.rooms) specs += '<div class="pcard__spec"><b>'+p.rooms+'</b><span>חדרים</span></div>';
      if(p.area)  specs += '<div class="pcard__spec"><b>'+p.area+'</b><span>מ"ר</span></div>';
      if(p.parking) specs += '<div class="pcard__spec"><b>'+p.parking+'</b><span>חניות</span></div>';
      return '<a class="pcard'+(p.saleStatus==='sold'?' is-sold':'')+'" href="property.html?id='+encodeURIComponent(p.id)+'">'+
        '<div class="pcard__media">'+
          (img?'<img src="'+esc(img)+'" alt="'+esc(p.name)+'" loading="lazy">':'')+
          '<span class="pstatus '+ss.cls+'"><i></i>'+ss.label+'</span>'+
        '</div>'+
        '<div class="pcard__body">'+
          '<h3 class="pcard__name">'+esc(p.name)+'</h3>'+
          '<p class="pcard__loc">'+esc(loc)+'</p>'+
          '<div class="pcard__specs">'+(specs||'<span class="pcard__loc">פרטים בעמוד הנכס</span>')+'</div>'+
          '<div class="pcard__foot">'+
            '<div class="pcard__price">'+(p.price?('<small>₪</small> '+money(p.price)):'לפי בקשה')+'</div>'+
            '<span class="pcard__go">צפה בנכס ‹</span>'+
          '</div>'+
        '</div>'+
      '</a>';
    }

    (function(){
      var list = DATA.properties || [];
      var el = document.getElementById('grid');
      el.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">לא נמצאו נכסים להצגה כרגע.</div>';
    })();
  </script>
</body>
</html>
