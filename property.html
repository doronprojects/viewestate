<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>נכס | ViewEstate</title>
  <meta name="description" content="נכס למכירה · ViewEstate">

  <!-- Open Graph – important for QR share previews (updated dynamically) -->
  <meta property="og:title"       id="ogTitle" content="ViewEstate">
  <meta property="og:description" id="ogDesc"  content="נכס למכירה · ViewEstate">
  <meta property="og:image"       id="ogImg"   content="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=85">
  <meta property="og:type"        content="website">
  <meta name="theme-color"        content="#1C1008">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Heebo:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F8F4EE;
      --bg-alt:      #EDE8DF;
      --bg-card:     #E5DFCE;
      --bg-dark:     #1C1008;
      --gold:        #9A7230;
      --gold-light:  #C9A35A;
      --gold-pale:   #E8D5A8;
      --text:        #1C1008;
      --text-mid:    #56382A;
      --text-muted:  #785B42;
      --border:      rgba(154,114,48,0.18);
      --border-md:   rgba(154,114,48,0.30);
      --sans:        'Heebo', Arial, sans-serif;
      --serif:       'Frank Ruhl Libre', Georgia, serif;
      --ease:        cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html { -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-weight: 300; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    img, video { display: block; }
    button { font-family: var(--sans); cursor: pointer; border: none; }

    /* ═══════════════════════════════════════
       VIDEO HERO — full screen, video first
    ═══════════════════════════════════════ */
    .vh {
      position: relative;
      background: var(--bg-dark);
    }
    .vh__media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 80vh;
      overflow: hidden;
      background: #000;
    }

    .vh__video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .vh__shade {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(20,10,4,0.50)  0%,
        rgba(20,10,4,0.0)   34%,
        rgba(20,10,4,0.0)  100%
      );
    }

    /* ── Top bar ── */
    .vh__topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .logo-sm {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      direction: ltr;
    }

    .logo-sm .v { color: var(--gold-light); }
    .logo-sm .e { color: rgba(248,244,238,0.9); }

    .back-link {
      font-size: 13px;
      color: rgba(248,244,238,0.78);
      background: rgba(20,10,4,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(248,244,238,0.14);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 2px;
      transition: border-color 0.3s, color 0.3s;
    }

    .back-link:hover { border-color: rgba(248,244,238,0.4); color: white; }

    .vh__topbar-actions { display: flex; align-items: center; gap: 8px; }
    .vh__lang {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(248,244,238,0.82);
      background: rgba(20,10,4,0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(248,244,238,0.14);
      padding: 8px 12px;
      border-radius: 2px;
      min-width: 40px;
      transition: border-color 0.3s, color 0.3s;
    }
    .vh__lang:hover { border-color: var(--gold-light); color: var(--gold-light); }

    /* ── Sound button ── */
    .vh__sound {
      position: absolute;
      top: 72px;
      left: 18px;
      z-index: 10;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(20,10,4,0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(248,244,238,0.18);
      color: rgba(248,244,238,0.85);
      font-size: 19px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.3s;
    }

    .vh__sound:hover { border-color: var(--gold-light); }
    .vh__sound.hidden { display: none; }
    .vh__sound svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
      fill: none; display: block;
    }

    /* ── Fullscreen button ── */
    .vh__fs {
      position: absolute;
      bottom: 14px; right: 14px;
      z-index: 10;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(20,10,4,0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(248,244,238,0.18);
      color: rgba(248,244,238,0.85);
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.3s;
    }
    .vh__fs:hover { border-color: var(--gold-light); }
    .vh__fs svg {
      width: 20px; height: 20px;
      stroke: currentColor; stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
      fill: none; display: block;
    }

    /* ── Bottom info ── */
    .vh__info {
      position: relative;
      background: var(--bg-dark);
      padding: 26px 24px 32px;
      z-index: 10;
    }

    .vh__badge {
      display: inline-block;
      background: #1F9D4D;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 5px 14px;
      border-radius: 3px;
      margin-bottom: 12px;
    }
    .vh__badge.st-sale { background: #1F9D4D; }
    .vh__badge.st-neg  { background: #E08A1E; }
    .vh__badge.st-sold { background: #C0392B; }

    .vh__title {
      font-family: var(--serif);
      font-size: clamp(28px, 7vw, 52px);
      color: #FAF6F0;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .vh__meta {
      font-size: 15px;
      color: rgba(248,244,238,0.82);
      font-weight: 300;
      margin-bottom: 18px;
    }

    .vh__price {
      font-family: var(--serif);
      font-size: clamp(24px, 5vw, 36px);
      color: #FAF6F0;
      font-weight: 700;
    }

    /* ── Scroll cue ── */
    .vh__cue {
      position: absolute;
      bottom: 136px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: cueFloat 2.2s ease-in-out infinite;
      pointer-events: none;
    }

    .vh__cue-label {
      font-size: 10px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: rgba(248,244,238,0.42);
    }

    .vh__cue-arrow {
      width: 20px; height: 20px;
      border-left: none;
      border-top: none;
      border-right: 2px solid rgba(248,244,238,0.35);
      border-bottom: 2px solid rgba(248,244,238,0.35);
      transform: rotate(45deg);
    }

    @keyframes cueFloat {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) translateY(0); }
      55%       { opacity: 0.35; transform: translateX(-50%) translateY(7px); }
    }

    /* ═══════════════════════════════════════
       SPECS STRIP
    ═══════════════════════════════════════ */
    .specs-strip {
      background: var(--bg-dark);
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(154,114,48,0.18);
    }

    .specs-strip::-webkit-scrollbar { display: none; }

    .spec-item {
      flex: 1;
      min-width: 100px;
      padding: 18px 20px;
      text-align: center;
      border-left: 1px solid rgba(154,114,48,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .spec-item:first-child { border-left: none; }

    .spec-icon {
      color: var(--gold-light);
      margin-bottom: 6px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spec-icon svg {
      width: 24px;
      height: 24px;
      display: block;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .spec-val {
      font-size: 17px;
      font-weight: 700;
      color: #FAF6F0;
      font-family: var(--serif);
    }

    .spec-lbl {
      font-size: 10px;
      color: rgba(248,244,238,0.72);
      letter-spacing: 1.5px;
    }

    /* ═══════════════════════════════════════
       MAIN CONTENT
    ═══════════════════════════════════════ */
    .page-content {
      padding-bottom: 92px; /* clearance for sticky CTA */
    }

    /* ── Gallery ── */
    .sec-gallery {
      padding: 32px 16px 28px;
      background: var(--bg);
    }

    .sec-gallery h2 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
      padding: 0 6px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }

    .g-item {
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      position: relative;
      padding: 0;
      width: 100%;
      font: inherit;
      display: block;
    }

    .g-item:first-child { grid-column: span 2; aspect-ratio: 16/9; }
    .g-item:not(:first-child) { aspect-ratio: 4/3; }

    .g-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.65s var(--ease);
    }

    .g-item:hover img { transform: scale(1.04); }

    .g-item__overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.3s;
    }

    .g-item:hover .g-item__overlay { background: rgba(0,0,0,0.12); }

    .g-item__zoom {
      opacity: 0;
      color: white;
      font-size: 22px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
    }

    .g-item:hover .g-item__zoom { opacity: 1; }

    /* ── Description ── */
    .sec-desc {
      padding: 36px 24px;
      background: var(--bg-alt);
    }

    .sec-desc h2 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
    }

    .sec-desc p {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text-mid);
    }

    .sec-desc p + p { margin-top: 14px; }

    /* ── Specs table ── */
    .sec-specs {
      padding: 36px 24px;
      background: var(--bg);
    }

    .sec-specs h2 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--text);
    }

    .specs-tbl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .spec-row {
      background: var(--bg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .spec-row__key { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
    .spec-row__val { font-size: 16px; font-weight: 600; color: var(--text); }

    /* ── Agent card ── */
    .sec-agent {
      padding: 32px 24px;
      background: var(--bg-alt);
      display: flex;
      align-items: center;
      gap: 18px;
      border-top: 1px solid var(--border);
    }

    .agent-photo {
      width: 72px; height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold);
      flex-shrink: 0;
    }

    .agent-name { font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .agent-role { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .agent-brand { font-size: 12px; color: var(--gold); font-weight: 600; }

    /* ── Lead form ── */
    .sec-lead {
      padding: 44px 24px;
      background: var(--bg-dark);
    }

    .sec-lead__head { text-align: center; margin-bottom: 28px; }
    .sec-lead__eyebrow { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold-light); font-weight: 600; margin-bottom: 10px; }
    .sec-lead h2 { font-family: var(--serif); font-size: clamp(24px,5vw,34px); font-weight: 700; color: #FAF6F0; line-height: 1.2; }
    .sec-lead__sub { font-size: 14px; color: rgba(248,244,238,0.78); margin-top: 10px; }

    .lead-form { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .lead-field { display: flex; flex-direction: column; gap: 6px; }
    .lead-field label { font-size: 12px; color: rgba(248,244,238,0.78); letter-spacing: 0.5px; }
    .lead-field input,
    .lead-field textarea,
    .lead-field select {
      background: rgba(248,244,238,0.06);
      border: 1px solid rgba(248,244,238,0.18);
      color: #FAF6F0;
      padding: 13px 14px;
      font-family: var(--sans);
      font-size: 15px;
      border-radius: 3px;
      transition: border-color 0.3s;
    }
    .lead-field input::placeholder, .lead-field textarea::placeholder { color: rgba(248,244,238,0.32); }
    .lead-field input:focus, .lead-field textarea:focus, .lead-field select:focus { outline: none; border-color: var(--gold-light); }
    .lead-field textarea { resize: vertical; min-height: 80px; }
    .lead-field select option { background: var(--bg-dark); color: #FAF6F0; }

    .lead-submit {
      background: #25D366;
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.3s, transform 0.3s;
      margin-top: 6px;
    }
    .lead-submit:hover { background: #1ebe5d; transform: translateY(-2px); }
    .lead-note { text-align: center; font-size: 12px; color: rgba(248,244,238,0.62); margin-top: 4px; }

    .prop-footer {
      background: #160C05;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
    }
    .prop-footer a { font-size: 13px; color: rgba(248,244,238,0.7); transition: color 0.3s; }
    .prop-footer a:hover { color: var(--gold-light); }

    /* ═══════════════════════════════════════
       STICKY CTA BAR — mobile-first WhatsApp
    ═══════════════════════════════════════ */
    .cta-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(248,244,238,0.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-md);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .cta-wa {
      flex: 1;
      background: #25D366;
      color: white;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .cta-wa:hover { background: #1ebe5d; }

    .cta-call {
      width: 52px; height: 52px;
      background: var(--bg-alt);
      border: 2px solid var(--border-md);
      color: var(--text);
      font-size: 20px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: border-color 0.3s;
    }

    .cta-call:hover { border-color: var(--gold); }
    .cta-call svg {
      width: 22px; height: 22px;
      stroke: var(--gold); stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
      fill: none; display: block;
    }

    /* ═══════════════════════════════════════
       LIGHTBOX
    ═══════════════════════════════════════ */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.open { display: flex; }

    .lightbox__img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .lightbox__close {
      position: absolute;
      top: 18px; left: 18px;
      background: none; border: none;
      color: rgba(255,255,255,0.75);
      font-size: 30px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
      transition: color 0.3s;
    }

    .lightbox__close:hover { color: white; }

    .lightbox__counter {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      letter-spacing: 2px;
    }

    .lightbox__prev,
    .lightbox__next {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .lightbox__prev { right: 16px; }
    .lightbox__next { left: 16px; }
    .lightbox__prev:hover, .lightbox__next:hover { background: rgba(255,255,255,0.18); }

    /* ═══════════════════════════════════════
       NOT FOUND STATE
    ═══════════════════════════════════════ */
    .notfound {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--bg-dark);
    }
    .notfound .logo-sm { font-size: 26px; margin-bottom: 24px; }
    .notfound h1 { font-family: var(--serif); font-size: 28px; color: #FAF6F0; margin-bottom: 12px; }
    .notfound p { color: rgba(248,244,238,0.55); margin-bottom: 28px; }
    .notfound a {
      border: 1px solid var(--gold-light);
      color: var(--gold-light);
      padding: 13px 32px;
      font-size: 14px;
      border-radius: 2px;
      transition: background 0.3s, color 0.3s;
    }
    .notfound a:hover { background: var(--gold-light); color: var(--bg-dark); }

    /* ═══════════════════════════════════════
       DESKTOP ENHANCEMENTS
    ═══════════════════════════════════════ */
    @media (min-width: 640px) {
      .vh__info { padding: 48px 48px; }
      .specs-strip { padding: 0 48px; }
    }

    @media (min-width: 768px) {
      .sec-gallery { padding: 48px; }
      .sec-desc, .sec-specs, .sec-agent, .sec-lead { padding-left: 48px; padding-right: 48px; }
      .cta-bar { padding: 16px 48px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

      .gallery-grid { grid-template-columns: repeat(3, 1fr); }
      .g-item:first-child { grid-column: span 3; aspect-ratio: 21/9; }
      .g-item:not(:first-child) { aspect-ratio: 16/10; }

      .specs-tbl { grid-template-columns: repeat(3,1fr); }

      .lightbox__prev { right: 32px; }
      .lightbox__next { left: 32px; }
    }

    @media (min-width: 1024px) {
      .sec-gallery { padding: 64px; }
      .sec-desc, .sec-specs, .sec-agent, .sec-lead { padding-left: 64px; padding-right: 64px; }
      .cta-bar { padding: 20px 64px; }
      .vh__info { padding: 56px 64px; }
    }
  </style>
</head>
<body>

  <!-- Rendered dynamically from data.js based on ?id= -->
  <div id="app"></div>

  <!-- ═══════════════════ LIGHTBOX ═══════════════════ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="תצוגת גלריה">
    <button class="lightbox__close" onclick="closeLB()" aria-label="סגור תצוגת תמונה">✕</button>
    <button class="lightbox__prev" onclick="shiftLB(1)" aria-label="התמונה הקודמת">›</button>
    <button class="lightbox__next" onclick="shiftLB(-1)" aria-label="התמונה הבאה">‹</button>
    <img class="lightbox__img" id="lbImg" src="" alt="">
    <div class="lightbox__counter" id="lbCounter"></div>
  </div>

  <script src="data.js?v=4"></script>
  <script>
    /* ---------- helpers ---------- */
    const DATA = window.VIEWESTATE_DATA || { agent: {}, properties: [] };
    const AGENT = DATA.agent || {};

    /* ---------- i18n ---------- */
    let LANG = (function () {
      const q = new URLSearchParams(location.search).get('lang');
      if (q === 'en' || q === 'he') return q;
      return localStorage.getItem('ve_lang') || 'he';
    })();
    const STR = {
      he: {
        dir: 'rtl', langBtn: 'EN',
        back: '← כל הנכסים', cuePhotos: 'תמונות',
        l_rooms: 'חדרים', l_area: 'מ"ר', l_floor: 'קומה', l_balcony: 'מ"ר מרפסת', l_parking: 'חניות', l_year: 'שנת בנייה',
        h_gallery: 'גלריית תמונות', h_desc: 'תיאור הנכס', h_area: 'על האזור', h_specs: 'פרטי הנכס',
        noDesc: 'אין תיאור זמין.',
        t_price: 'מחיר', t_city: 'עיר', t_neighborhood: 'שכונה', t_area: 'שטח', t_rooms: 'חדרים', t_floor: 'קומה', t_balcony: 'מרפסת', t_parking: 'חניה', t_storage: 'מחסן', t_elevator: 'מעלית', t_year: 'שנת בנייה', t_condition: 'מצב',
        lead_eyebrow: 'השאירו פרטים', lead_h: 'מתעניינים בנכס הזה?', lead_sub: 'מלאו פרטים ונחזור אליכם — או שלחו ישירות בוואטסאפ',
        f_name: 'שם מלא', f_name_ph: 'השם שלך', f_phone: 'טלפון', f_phone_ph: '050-0000000', f_interest: 'תחום עניין', f_msg: 'הודעה (אופציונלי)', f_msg_ph: 'משהו שתרצו להוסיף?',
        opt_buy: 'אני מתעניין/ת לקנות', opt_info: 'רוצה לקבל פרטים נוספים', opt_visit: 'לתאם צפייה בנכס', opt_general: 'פנייה כללית',
        foot_acc: 'הצהרת נגישות', foot_privacy: 'מדיניות פרטיות',
        u_sqm: 'מ"ר', u_rooms: 'חדרים', u_floorOf: 'מתוך', u_spots: 'מקומות',
        ss_sale: 'למכירה', ss_neg: 'במשא ומתן', ss_sold: 'נמכר',
        notfound_h: 'הנכס לא נמצא', notfound_p: 'ייתכן שהנכס הוסר או שהקישור שגוי.', notfound_a: '← חזרה לכל הנכסים',
        aria_sound: 'הפעל צליל', aria_call: 'התקשר', aria_lang: 'switch to English', aria_fs: 'הגדל למסך מלא'
      },
      en: {
        dir: 'ltr', langBtn: 'עב',
        back: '← All properties', cuePhotos: 'Photos',
        l_rooms: 'Rooms', l_area: 'm²', l_floor: 'Floor', l_balcony: 'Balcony m²', l_parking: 'Parking', l_year: 'Year',
        h_gallery: 'Photo Gallery', h_desc: 'Description', h_area: 'About the Area', h_specs: 'Property Details',
        noDesc: 'No description available.',
        t_price: 'Price', t_city: 'City', t_neighborhood: 'Neighborhood', t_area: 'Area', t_rooms: 'Rooms', t_floor: 'Floor', t_balcony: 'Balcony', t_parking: 'Parking', t_storage: 'Storage', t_elevator: 'Elevator', t_year: 'Year built', t_condition: 'Condition',
        lead_eyebrow: 'Leave your details', lead_h: 'Interested in this property?', lead_sub: "Fill in your details and we'll get back to you — or message directly on WhatsApp",
        f_name: 'Full name', f_name_ph: 'Your name', f_phone: 'Phone', f_phone_ph: '050-0000000', f_interest: 'Interest', f_msg: 'Message (optional)', f_msg_ph: 'Anything to add?',
        opt_buy: "I'm interested in buying", opt_info: 'I want more details', opt_visit: 'Schedule a viewing', opt_general: 'General inquiry',
        foot_acc: 'Accessibility statement', foot_privacy: 'Privacy Policy',
        u_sqm: 'm²', u_rooms: 'rooms', u_floorOf: 'of', u_spots: 'spots',
        ss_sale: 'For Sale', ss_neg: 'Under Offer', ss_sold: 'Sold',
        notfound_h: 'Property not found', notfound_p: 'The property may have been removed or the link is incorrect.', notfound_a: '← Back to all properties',
        aria_sound: 'Play sound', aria_call: 'Call', aria_lang: 'מעבר לעברית', aria_fs: 'Fullscreen'
      }
    };
    function t(k) { return (STR[LANG] && STR[LANG][k] != null) ? STR[LANG][k] : STR.he[k]; }
    function pick(o, base) {
      if (!o) return '';
      if (LANG === 'en' && o[base + '_en'] != null && o[base + '_en'] !== '') return o[base + '_en'];
      return o[base] != null ? o[base] : '';
    }
    function ynt(v) {
      if (LANG !== 'en') return v;
      if (v === 'כן') return 'Yes';
      if (v === 'לא') return 'No';
      return v;
    }
    function applyDir() {
      document.documentElement.lang = LANG;
      document.documentElement.dir = t('dir');
    }
    function toggleLang() {
      LANG = (LANG === 'he') ? 'en' : 'he';
      localStorage.setItem('ve_lang', LANG);
      paint();
    }

    /* gallery/lightbox state (declared early so wireUp can assign on first paint) */
    let srcs = [], current = 0;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function fmtPrice(n) {
      if (n == null || n === '') return '';
      const num = Number(n);
      if (isNaN(num)) return esc(n);
      return num.toLocaleString('en-US') + ' ₪';
    }
    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }
    function findProperty(id) {
      const list = DATA.properties || [];
      if (id) return list.find(p => p.id === id) || null;
      return list.find(p => p.featured) || list[0] || null;
    }
    function waLink(text) {
      return 'https://wa.me/' + (AGENT.whatsapp || '') + '?text=' + encodeURIComponent(text);
    }
    function saleStatusInfo(s) {
      switch (s) {
        case 'negotiation': return { label: t('ss_neg'),  cls: 'st-neg' };
        case 'sold':        return { label: t('ss_sold'), cls: 'st-sold' };
        case 'sale':
        default:            return { label: t('ss_sale'), cls: 'st-sale' };
      }
    }

    /* ---------- render ---------- */
    const prop = findProperty(getParam('id'));
    const app = document.getElementById('app');

    function paint() {
      applyDir();
      if (!prop) {
        app.innerHTML = `
          <div class="notfound">
            <div class="logo-sm"><span class="v">VIEW</span><span class="e">ESTATE</span></div>
            <h1>${t('notfound_h')}</h1>
            <p>${t('notfound_p')}</p>
            <a href="index.html">${t('notfound_a')}</a>
          </div>`;
      } else {
        renderProperty(prop);
      }
    }
    paint();

    function renderProperty(p) {
      /* meta / SEO */
      const nm = pick(p, 'name');
      const metaLine = [
        p.rooms ? p.rooms + ' ' + t('u_rooms') : '',
        p.area  ? p.area  + ' ' + t('u_sqm')   : '',
        p.floor ? t('t_floor') + ' ' + p.floor : '',
        pick(p, 'city')
      ].filter(Boolean).join('  ·  ');
      document.title = nm + ' | ViewEstate';
      const heroImg = (p.gallery && p.gallery[0]) || p.poster || '';
      setMeta('ogTitle', nm + ' | ViewEstate');
      setMeta('ogDesc', metaLine + ' · ' + fmtPrice(p.price));
      setMeta('ogImg', heroImg);
      document.querySelector('meta[name="description"]').setAttribute('content', metaLine + ' · ' + fmtPrice(p.price));

      /* specs strip — only show non-empty */
      const ICONS = {
        rooms:   '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M2 18h20"/><path d="M12 4v6"/></svg>',
        area:    '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M8 16 16 8"/><path d="M16 13v3h-3"/><path d="M8 11V8h3"/></svg>',
        floor:   '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>',
        balcony: '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>',
        parking: '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>',
        year:    '<svg viewBox="0 0 24 24" width="24" height="24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>'
      };
      const stripDefs = [
        { icon: ICONS.rooms,   val: p.rooms,   lbl: t('l_rooms') },
        { icon: ICONS.area,    val: p.area,    lbl: t('l_area') },
        { icon: ICONS.floor,   val: p.floor,   lbl: t('l_floor') },
        { icon: ICONS.balcony, val: p.balcony, lbl: t('l_balcony') },
        { icon: ICONS.parking, val: p.parking, lbl: t('l_parking') },
        { icon: ICONS.year,    val: p.year,    lbl: t('l_year') }
      ].filter(s => s.val !== '' && s.val != null && s.val !== 0);
      const stripHtml = stripDefs.map(s => `
        <div class="spec-item">
          <span class="spec-icon">${s.icon}</span>
          <span class="spec-val">${esc(s.val)}</span>
          <span class="spec-lbl">${esc(s.lbl)}</span>
        </div>`).join('');

      /* gallery */
      const gallery = (p.gallery && p.gallery.length) ? p.gallery : (p.poster ? [p.poster] : []);
      const galleryHtml = gallery.map((src, i) => `
        <button type="button" class="g-item" data-idx="${i}" aria-label="${esc(nm)} — ${i + 1}/${gallery.length}">
          <img src="${esc(src)}" alt="${esc(nm)} — ${i + 1}" loading="lazy">
          <div class="g-item__overlay" aria-hidden="true"><span class="g-item__zoom">⊕</span></div>
        </button>`).join('');

      /* description — split on newlines into paragraphs */
      const descHtml = String(pick(p, 'description') || '').split(/\n+/).filter(Boolean)
        .map(par => `<p>${esc(par)}</p>`).join('') || `<p>${esc(t('noDesc'))}</p>`;

      /* about-the-area — optional section */
      const areaRaw = pick(p, 'areaInfo');
      const areaHtml = areaRaw
        ? String(areaRaw).split(/\n+/).filter(Boolean).map(par => `<p>${esc(par)}</p>`).join('')
        : '';

      /* specs table — only non-empty rows */
      const floorTxt = p.floor ? (p.floorsTotal ? p.floor + ' ' + t('u_floorOf') + ' ' + p.floorsTotal : String(p.floor)) : '';
      const rows = [
        [t('t_price'), fmtPrice(p.price)],
        [t('t_city'), pick(p, 'city')],
        [t('t_neighborhood'), pick(p, 'neighborhood')],
        [t('t_area'), p.area ? p.area + ' ' + t('u_sqm') : ''],
        [t('t_rooms'), p.rooms ? p.rooms + ' ' + t('u_rooms') : ''],
        [t('t_floor'), floorTxt],
        [t('t_balcony'), p.balcony ? p.balcony + ' ' + t('u_sqm') : ''],
        [t('t_parking'), p.parking ? p.parking + ' ' + t('u_spots') : ''],
        [t('t_storage'), ynt(p.storage)],
        [t('t_elevator'), ynt(p.elevator)],
        [t('t_year'), p.year],
        [t('t_condition'), pick(p, 'condition')]
      ].filter(r => r[1] !== '' && r[1] != null);
      const tableHtml = rows.map(r => `
        <div class="spec-row">
          <span class="spec-row__key">${esc(r[0])}</span>
          <span class="spec-row__val">${esc(r[1])}</span>
        </div>`).join('');

      /* hero media — video if available, else image */
      const vidSources = (function () {
        let s = '';
        if (/^videos\/.*\.mp4$/i.test(p.video || '')) {
          s += `<source src="${esc(p.video.replace(/\.mp4$/i, '.webm'))}" type="video/webm">`;
        }
        s += `<source src="${esc(p.video)}" type="video/mp4">`;
        return s;
      })();
      const heroMedia = p.video
        ? `<video class="vh__video" id="propVid" autoplay muted loop playsinline poster="${esc(p.poster || heroImg)}">${vidSources}</video>`
        : `<img class="vh__video" src="${esc(p.poster || heroImg)}" alt="${esc(nm)}">`;

      /* whatsapp prefilled */
      const agentNm = pick(AGENT, 'name') || '';
      const waText = (LANG === 'en')
        ? `Hello ${agentNm}, I saw the property "${nm}" on the ViewEstate site and would love to hear more.`
        : `שלום ${agentNm}, ראיתי את הנכס "${nm}" באתר ViewEstate ואשמח לשמוע פרטים.`;
      const waHref = waLink(waText);

      app.innerHTML = `
      <div class="vh">
        <div class="vh__media">
          ${heroMedia}
          <div class="vh__shade"></div>
          <div class="vh__topbar">
            <a href="index.html" class="logo-sm"><span class="v">VIEW</span><span class="e">ESTATE</span></a>
            <div class="vh__topbar-actions">
              <button class="vh__lang" onclick="toggleLang()" aria-label="${esc(t('aria_lang'))}">${t('langBtn')}</button>
              <a href="index.html" class="back-link">${t('back')}</a>
            </div>
          </div>
          ${p.video ? '<button class="vh__sound" id="soundBtn" onclick="toggleSound()" aria-label="' + esc(t('aria_sound')) + '"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z\"/><line x1=\"22\" x2=\"16\" y1=\"9\" y2=\"15\"/><line x1=\"16\" x2=\"22\" y1=\"9\" y2=\"15\"/></svg></button>' : ''}
          ${p.video ? '<button class="vh__fs" onclick="goFullscreen()" aria-label="' + esc(t('aria_fs')) + '"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 3H5a2 2 0 0 0-2 2v3\"/><path d="M21 8V5a2 2 0 0 0-2-2h-3\"/><path d="M3 16v3a2 2 0 0 0 2 2h3\"/><path d="M16 21h3a2 2 0 0 0 2-2v-3\"/></svg></button>' : ''}
        </div>
        <div class="vh__info">
          ${(function(){ var ss = saleStatusInfo(p.saleStatus); return `<div class="vh__badge ${ss.cls}">${ss.label}</div>`; })()}
          <h1 class="vh__title">${esc(nm)}</h1>
          <p class="vh__meta">${esc(metaLine)}</p>
          <div class="vh__price">${fmtPrice(p.price)}</div>
        </div>
      </div>

      <div class="specs-strip">${stripHtml}</div>

      <main class="page-content">
        <div class="sec-gallery">
          <h2>${t('h_gallery')}</h2>
          <div class="gallery-grid" id="gallery">${galleryHtml}</div>
        </div>

        <div class="sec-desc">
          <h2>${t('h_desc')}</h2>
          ${descHtml}
        </div>
        ${areaHtml ? `
        <div class="sec-desc sec-area">
          <h2>${t('h_area')}</h2>
          ${areaHtml}
        </div>` : ''}

        <div class="sec-specs">
          <h2>${t('h_specs')}</h2>
          <div class="specs-tbl">${tableHtml}</div>
        </div>

        <div class="sec-agent">
          <img class="agent-photo" src="${esc(AGENT.photo || '')}" alt="${esc(agentNm)}">
          <div>
            <div class="agent-name">${esc(agentNm)}</div>
            <div class="agent-role">${esc(pick(AGENT, 'role'))}</div>
            <div class="agent-brand"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg> ${esc(AGENT.brand || 'ViewEstate')} · ${esc(AGENT.site || '')}</div>
          </div>
        </div>

        <div class="sec-lead">
          <div class="sec-lead__head">
            <div class="sec-lead__eyebrow">${t('lead_eyebrow')}</div>
            <h2>${t('lead_h')}</h2>
            <p class="sec-lead__sub">${t('lead_sub')}</p>
          </div>
          <form class="lead-form" id="leadForm">
            <div class="lead-field">
              <label for="lf-name">${t('f_name')}</label>
              <input type="text" id="lf-name" name="name" autocomplete="name" placeholder="${esc(t('f_name_ph'))}" required>
            </div>
            <div class="lead-field">
              <label for="lf-phone">${t('f_phone')}</label>
              <input type="tel" id="lf-phone" name="tel" autocomplete="tel" placeholder="${esc(t('f_phone_ph'))}" required>
            </div>
            <div class="lead-field">
              <label for="lf-interest">${t('f_interest')}</label>
              <select id="lf-interest">
                <option>${t('opt_buy')}</option>
                <option>${t('opt_info')}</option>
                <option>${t('opt_visit')}</option>
                <option>${t('opt_general')}</option>
              </select>
            </div>
            <div class="lead-field">
              <label for="lf-msg">${t('f_msg')}</label>
              <textarea id="lf-msg" placeholder="${esc(t('f_msg_ph'))}"></textarea>
            </div>
            <button type="submit" class="lead-submit">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.944-1.418A9.953 9.953 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
              ${LANG === 'en' ? 'Send to ' + esc(agentNm) + ' on WhatsApp' : 'שלח/י ל' + esc(agentNm) + ' בוואטסאפ'}
            </button>
            <p class="lead-note">${LANG === 'en' ? "Your details go directly to " + esc(agentNm) + "'s WhatsApp" : 'הפרטים נשלחים ישירות לוואטסאפ של ' + esc(agentNm)}</p>
          </form>
        </div>

        <footer class="prop-footer">
          <a href="index.html">${t('back')}</a>
          <a href="accessibility.html">${t('foot_acc')}</a>
          <a href="privacy.html">${t('foot_privacy')}</a>
        </footer>
      </main>

      <div class="cta-bar">
        <a href="${waHref}" class="cta-wa" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.944-1.418A9.953 9.953 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/></svg>
          ${LANG === 'en' ? 'Message ' + esc(agentNm) : 'שלח הודעה ל' + esc(agentNm)}
        </a>
        <a href="tel:+${esc(AGENT.whatsapp || '')}" class="cta-call" aria-label="${esc(t('aria_call'))}"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg></a>
      </div>`;

      wireUp(p);
    }

    function setMeta(id, content) {
      const el = document.getElementById(id);
      if (el) el.setAttribute('content', content);
    }

    /* ---------- interactions ---------- */
    const SND_OFF = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>';
    const SND_ON  = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 6.4a9 9 0 0 1 0 11.3"/></svg>';
    function toggleSound() {
      const vid = document.getElementById('propVid');
      if (!vid) return;
      vid.muted = !vid.muted;
      if (!vid.muted) vid.play().catch(() => {});
      document.getElementById('soundBtn').innerHTML = vid.muted ? SND_OFF : SND_ON;
    }

    function goFullscreen() {
      const vid = document.getElementById('propVid');
      if (!vid) return;
      const box = vid.closest('.vh__media') || vid;
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
        return;
      }
      if (vid.webkitEnterFullscreen) { vid.webkitEnterFullscreen(); return; }   /* iOS: video only */
      const el = box;
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    }

    function wireUp(p) {
      /* hide scroll cue on first scroll */
      const cue = document.querySelector('.vh__cue');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 40 && cue) { cue.style.opacity = '0'; cue.style.transition = 'opacity 0.6s ease'; }
      }, { passive: true, once: true });

      /* lightbox */
      const items = document.querySelectorAll('.g-item');
      srcs = [...items].map(i => i.querySelector('img').src);
      items.forEach(item => item.addEventListener('click', () => openLB(parseInt(item.dataset.idx))));

      /* lead form → whatsapp */
      const form = document.getElementById('leadForm');
      if (form) {
        form.addEventListener('submit', e => {
          e.preventDefault();
          const name = document.getElementById('lf-name').value.trim();
          const phone = document.getElementById('lf-phone').value.trim();
          const interest = document.getElementById('lf-interest').value;
          const msg = document.getElementById('lf-msg').value.trim();
          const agentNm = pick(AGENT, 'name') || '';
          const pNm = pick(p, 'name');
          const lines = (LANG === 'en')
            ? [
                `Hello ${agentNm}, inquiry via the ViewEstate site:`,
                ``,
                `*Property:* ${pNm}`,
                `*Name:* ${name}`,
                `*Phone:* ${phone}`,
                `*Interest:* ${interest}`,
                msg ? `*Message:* ${msg}` : ''
              ]
            : [
                `שלום ${agentNm}, פנייה דרך אתר ViewEstate:`,
                ``,
                `*נכס:* ${pNm}`,
                `*שם:* ${name}`,
                `*טלפון:* ${phone}`,
                `*עניין:* ${interest}`,
                msg ? `*הודעה:* ${msg}` : ''
              ];
          window.open(waLink(lines.join('\n')), '_blank');
        });
      }
    }

    function openLB(idx) {
      current = idx;
      document.getElementById('lbImg').src = srcs[idx];
      document.getElementById('lbCounter').textContent = `${idx + 1} / ${srcs.length}`;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLB() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function shiftLB(dir) {
      if (!srcs.length) return;
      current = (current + dir + srcs.length) % srcs.length;
      openLB(current);
    }

    document.getElementById('lightbox').addEventListener('click', function (e) { if (e.target === this) closeLB(); });
    document.getElementById('lbImg').addEventListener('click', e => e.stopPropagation());
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLB();
      if (e.key === 'ArrowRight') shiftLB(-1);
      if (e.key === 'ArrowLeft')  shiftLB(1);
    });

    /* touch swipe for lightbox */
    let lbTouchX = null;
    const lb = document.getElementById('lightbox');
    lb.addEventListener('touchstart', e => { lbTouchX = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => {
      if (lbTouchX === null) return;
      const diff = lbTouchX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) shiftLB(diff > 0 ? 1 : -1);
      lbTouchX = null;
    }, { passive: true });
  </script>
  <script src="accessibility.js?v=2" defer></script>
</body>
</html>
